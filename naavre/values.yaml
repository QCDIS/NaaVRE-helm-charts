argo-workflows:
  enabled: true

jupyterhub:
  enabled: true

k8s-secret-creator:
  enabled: true

keycloak:
  enabled: true
  global:
    security:
      allowInsecureImages: true
  image:
    repository: bitnamilegacy/keycloak
  keycloakConfigCli:
    image:
      repository: bitnamilegacy/keycloak-config-cli
  postgresql:
    image:
      repository: bitnamilegacy/postgresql
    volumePermissions:
      image:
        repository: bitnamilegacy/bitnami-shell
    metrics:
      image:
        repository: bitnamilegacy/postgres-exporter

vrepaas:
  enabled: true

global:
  secrets:
    keycloak:
      client_id:
      client_secret:
